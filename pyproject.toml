[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apollo-planetary-defense"
version = "1.0.0"
description = "NASA Asteroid Proximity & Orbital Location, Linkage & Observation Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "boto3>=1.34.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "pyarrow>=15.0.0",
    "pandas>=2.0.0",
    "ruff==0.15.2",
    "duckdb>=1.0.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [
    "backend",
    ".",
    "tests/integration",
    "backend/api",
    "backend/storage",
    "backend/pipelines/ingestion",
    "backend/pipelines/resolution",
    "backend/pipelines/quality",
    "backend/pipelines/utils",
]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", "__pycache__", "frontend", "data", ".venv", "venv"]
